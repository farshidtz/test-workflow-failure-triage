name: Dummy Test Workload

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-job-a:
    name: Test Job A
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dummy workload
        run: bash scripts/dummy_test_workload.sh

  test-job-b:
    name: Test Job B
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dummy workload
        run: bash scripts/dummy_test_workload.sh

  test-job-c:
    name: Test Job C
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run dummy workload
        run: bash scripts/dummy_test_workload.sh

  triage:
    name: "Triage Failed Jobs (run #${{ github.run_number }})"
    needs: [test-job-a, test-job-b, test-job-c]
    if: failure()
    runs-on: ubuntu-slim
    permissions:
      actions: write # required to re-run jobs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Triage
        uses: ./.github/actions/triage
        with:
          patterns: |
            Internal 500 server error
            Timeout provisioning
