name: Triage Failed Jobs
description: >
  Inspects failed jobs in the current workflow run, classifies each failure
  as infrastructure-related or not, and automatically re-runs failed jobs
  when all failures are infrastructure-related.

inputs:
  patterns:
    description: 'Newline-separated list of patterns that indicate an infrastructure failure'
    required: true

runs:
  using: composite
  steps:
    - name: Classify failures and retry if infra-related
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_ID: ${{ github.run_id }}
        REPO: ${{ github.repository }}
        INFRA_PATTERNS_INPUT: ${{ inputs.patterns }}
      run: |
        set -euo pipefail

        # Build a grep -E alternation string from the newline-separated input.
        # Blank lines are stripped so trailing newlines in the YAML block scalar don't produce empty patterns.
        INFRA_PATTERN_RE=$(echo "${INFRA_PATTERNS_INPUT}" | grep -v '^[[:space:]]*$' | paste -sd '|')
        echo "==> Infra patterns: ${INFRA_PATTERN_RE}"

        echo "==> Fetching failed jobs for run ${RUN_ID}..."

        FAILED_JOBS=$(gh api \
          "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
          --jq '[.jobs[] | select(.conclusion == "failure" and (.name | startswith("Triage Failed Jobs") | not))]')

        JOB_COUNT=$(echo "${FAILED_JOBS}" | jq 'length')
        echo "==> Found ${JOB_COUNT} failed job(s)"

        if [[ "${JOB_COUNT}" -eq 0 ]]; then
          echo "==> No failed jobs. Nothing to triage."
          exit 0
        fi

        ALL_INFRA=true
        SUMMARY=""

        while IFS= read -r JOB; do
          JOB_ID=$(echo "${JOB}" | jq -r '.id')
          JOB_NAME=$(echo "${JOB}" | jq -r '.name')
          echo ""
          echo "--- Inspecting: ${JOB_NAME} (id=${JOB_ID}) ---"

          # The logs endpoint returns a 302 redirect; curl -L follows it.
          LOGS=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/jobs/${JOB_ID}/logs" \
            || true)

          if echo "${LOGS}" | grep -qE "${INFRA_PATTERN_RE}"; then
            MATCHED=$(echo "${LOGS}" | grep -oE "${INFRA_PATTERN_RE}" | head -1)
            echo "==> INFRA failure: '${MATCHED}'"
            SUMMARY="${SUMMARY}\n- [INFRA]     ${JOB_NAME}: ${MATCHED}"
          else
            echo "==> NON-INFRA failure — will not auto-retry"
            SUMMARY="${SUMMARY}\n- [NON-INFRA] ${JOB_NAME}: no infra pattern matched"
            ALL_INFRA=false
          fi
        done < <(echo "${FAILED_JOBS}" | jq -c '.[]')

        echo ""
        echo "==> Triage summary:"
        echo -e "${SUMMARY}"
        echo ""

        if [[ "${ALL_INFRA}" == "true" ]]; then
          echo "==> All failures are infrastructure-related. Re-running failed jobs..."
          gh api \
            --method POST \
            "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "==> Re-run triggered."
        else
          echo "==> Non-infrastructure failures present. Skipping auto-retry."
          echo "==> Manual investigation required."
          exit 1
        fi

    - name: Write job summary
      if: always()
      shell: bash
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        echo "### Triage result for [run ${RUN_ID}](${RUN_URL})" >> "${GITHUB_STEP_SUMMARY}"
        echo "" >> "${GITHUB_STEP_SUMMARY}"
        echo "See the step logs above for the per-job classification." >> "${GITHUB_STEP_SUMMARY}"
